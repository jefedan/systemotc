{% extends "base.html" %}
{% block title %}Verificación MFA{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center">
<div style="width:100%;max-width:380px">
  <div style="text-align:center;margin-bottom:2rem">
    <div style="font-size:3rem">📱</div>
    <h1 style="font-size:1.3rem;font-weight:700;margin:.5rem 0">Verificación en dos pasos</h1>
    <p class="text-muted">Hola <strong>{{ username }}</strong>, ingresa tu código TOTP</p>
  </div>
  <div class="card">
    <form method="POST" action="{{ url_for('auth.mfa_verify') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Código de 6 dígitos</label>
        <input type="text" name="token" class="form-control" placeholder="000000"
               maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autofocus
               style="font-size:1.5rem;letter-spacing:.4rem;text-align:center">
        <p style="font-size:11px;color:var(--muted);margin-top:.4rem">Desde tu app autenticadora (Google Authenticator, Authy, etc.)</p>
      </div>
      <button type="submit" class="btn btn-primary w-full">Verificar</button>
    </form>
  </div>
  <p style="text-align:center;margin-top:1rem;font-size:12px">
    <a href="{{ url_for('auth.login') }}">← Volver al login</a>
  </p>
</div>
</div>
{% endblock %}
