{% extends "base.html" %}
{% block title %}Cambiar Contraseña{% endblock %}
{% block content %}
<div style="max-width:480px;margin:2rem auto">
  <h2 class="section-title">🔑 Cambiar Contraseña</h2>
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Contraseña actual</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Nueva contraseña</label>
        <input type="password" name="new_password" id="new_pwd" class="form-control" required oninput="checkStrength(this.value)">
        <div id="strength-bar" style="height:4px;border-radius:2px;margin-top:.4rem;background:var(--border);transition:all .3s">
          <div id="strength-fill" style="height:100%;border-radius:2px;width:0;transition:all .3s;background:var(--red)"></div>
        </div>
        <div id="strength-issues" style="font-size:11px;color:var(--muted);margin-top:.3rem"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-full">Actualizar contraseña</button>
    </form>
  </div>
  <p style="margin-top:1rem"><a href="{{ url_for('dash.index') }}">← Volver</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
async function checkStrength(pwd) {
  if (!pwd) return;
  const data = await apiPost('{{ url_for("auth.api_password_strength") }}', {password: pwd});
  const fill = document.getElementById('strength-fill');
  const issues = document.getElementById('strength-issues');
  fill.style.width = data.score + '%';
  fill.style.background = data.score >= 80 ? 'var(--green)' : data.score >= 40 ? 'var(--yellow)' : 'var(--red)';
  issues.innerHTML = data.issues.length ? '❌ ' + data.issues.join(' · ') : '✅ Contraseña fuerte';
  issues.style.color = data.strong ? 'var(--green)' : 'var(--muted)';
}
</script>
{% endblock %}
